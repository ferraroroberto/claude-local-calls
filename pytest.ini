[pytest]
# Every test this repo owns lives under tests/ (verified: no test_*.py exists
# anywhere else in the tree). Stating that explicitly matters because `vendor/`
# is no longer binaries-only — since #492 it holds ComfyUI, a full Python
# application shipping its own ~40-module pytest suite under
# vendor/comfyui/tests-unit/. A bare `pytest` from the repo root used to be
# harmless; without this it collects ComfyUI's tests and dies during collection.
#
# Config rather than an --ignore flag on scripts/verify-before-ship.ps1 so every
# entry point agrees: the local gate, CI, a bare `pytest`, and an IDE runner.
# Explicit paths still win, so `pytest tests/e2e` behaves as before.
testpaths = tests
norecursedirs = vendor models data node_modules *.egg .*
