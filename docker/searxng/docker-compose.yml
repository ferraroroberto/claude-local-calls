# Self-hosted SearXNG for the voice assistant's Tier-3 web-search function
# (home-automation#321). A meta-search engine — no API key, no per-query cost.
#
# Start:  start_searxng.bat   (or `docker compose -f docker/searxng/docker-compose.yml up -d`)
# Stop:   stop_searxng.bat    (or `docker compose -f docker/searxng/docker-compose.yml down`)
#
# Ports exposed to the host:
#   8085 -> searxng (container listens on :8080 internally)
#
# Bound to 0.0.0.0 (not 127.0.0.1) so the HA VM (192.168.0.4) can reach it
# over the LAN, the same trust model as the hub's own :8000. Treat it the
# same way: trusted networks only, never port-forward to the public internet.
#
# JSON output is off by default in SearXNG (abuse-prevention default) — the
# home-automation webapp's Search-engine card and the HA rest function both
# need `format=json`. config/settings.yml is generated by the container on
# first run (including a fresh random secret key) and bind-mounted so it
# persists across restarts; start_searxng.bat then runs
# ensure_json_format.py to idempotently patch search.formats on that
# generated file (leaving secret_key untouched), since there is nothing to
# commit here — the file itself is gitignored.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://192.168.0.13:8085/
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "2"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
